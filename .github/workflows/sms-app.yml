# «Орлого SMS» Android апп (sms-app/) → APK build хийж GitHub Release-д тавина.
# Actions → "SMS апп APK" → Run workflow (эсвэл sms-app/ өөрчлөгдөхөд автоматаар).
# Release-ийн нэр sms-app-…, «latest» болгохгүй (Autoshop.mn аппын татах холбоост нөлөөлөхгүй).
name: SMS апп APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sms-app/**", ".github/workflows/sms-app.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK build
        run: gradle assembleRelease --no-daemon
      - name: Нэр өгөх
        run: cp app/build/outputs/apk/release/app-release.apk orlogo-sms.apk && ls -lh orlogo-sms.apk
      - uses: actions/upload-artifact@v4
        with:
          name: orlogo-sms-apk
          path: sms-app/orlogo-sms.apk
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sms-app-${{ github.run_number }}" orlogo-sms.apk \
            --target "${{ github.sha }}" \
            --title "Орлого SMS апп #${{ github.run_number }}" \
            --notes "Банкны орлогын SMS-ийг Autoshop.mn руу дамжуулах Android апп. Утсандаа татаж суулгаад Админ → Тохиргоо → SMS апп хэсгийн хаяг, түлхүүрийг оруулна." \
            --latest=false
